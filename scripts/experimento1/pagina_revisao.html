<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisão de Adulterações</title>
<!-- Template de scripts/experimento1/gerar_pagina_revisao.py; os dados são injetados no lugar do marcador. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5f6b7a; --border: #dde2e8;
  --accent: #2f5fd0; --ok: #1f8a4c; --warn: #b7791f; --bad: #c53030;
  --del-bg: #fde2e1; --del-fg: #9b1c1c; --ins-bg: #d9f5e3; --ins-fg: #135c34;
  --chip: #eef1f5; --sel: #e7eefc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1c2027; --text: #e4e7ec; --muted: #9aa4b2; --border: #2e343e;
    --accent: #7ea2ff; --ok: #5fcf8d; --warn: #e2b04a; --bad: #f07272;
    --del-bg: #4a2224; --del-fg: #ffb4b0; --ins-bg: #1d3d2a; --ins-fg: #a6ecc0;
    --chip: #262b33; --sel: #23304a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
header h1 { font-size: 16px; margin: 0; }
.progress { flex: 1 1 260px; min-width: 200px; }
.bar { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.counts { font-size: 13px; color: var(--muted); }
.actions { display: flex; gap: 8px; }
button, select, .filebtn { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
button:hover, .filebtn:hover { border-color: var(--accent); }
.layout { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 56px); }
aside { border-right: 1px solid var(--border); background: var(--panel); padding: 12px; overflow-y: auto; max-height: calc(100vh - 56px); position: sticky; top: 56px; }
aside .filters { display: grid; gap: 6px; margin-bottom: 10px; }
aside label.inline { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: center; font-size: 13px; }
.list li:hover { background: var(--chip); }
.list li.sel { background: var(--sel); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--border); }
.dot.aprovado { background: var(--ok); } .dot.ajustar { background: var(--warn); } .dot.rejeitado { background: var(--bad); }
.list .flag { margin-left: auto; color: var(--warn); }
main { padding: 16px; max-width: 980px; width: 100%; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
.chip.tipo { background: var(--accent); color: var(--panel); }
.nav { margin-left: auto; display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.texto p { margin: 0 0 8px; }
.texto table { border-collapse: collapse; margin: 6px 0 10px; font-size: 14px; }
.texto td { border: 1px solid var(--border); padding: 3px 8px; }
del { background: var(--del-bg); color: var(--del-fg); text-decoration: line-through; border-radius: 3px; padding: 0 2px; }
ins { background: var(--ins-bg); color: var(--ins-fg); text-decoration: none; border-radius: 3px; padding: 0 2px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-left: auto; text-transform: none; letter-spacing: 0; }
.seg button { border: 0; border-radius: 0; padding: 2px 10px; }
.seg button.on { background: var(--accent); color: var(--panel); }
.alts { display: grid; gap: 6px; }
.alt { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: start; padding: 6px 8px; border-radius: 6px; }
.alt .letra { font-weight: 700; }
.alt.gab { outline: 2px solid var(--ok); }
.alt.gab-orig { outline: 2px dashed var(--muted); }
.alt .tag { font-size: 12px; color: var(--muted); white-space: nowrap; }
.gabline { margin-top: 8px; font-size: 14px; }
dl { margin: 0; display: grid; grid-template-columns: 190px 1fr; gap: 6px 12px; font-size: 14px; }
dt { color: var(--muted); }
dd { margin: 0; }
.msgs { margin: 0; padding-left: 18px; font-size: 14px; }
.msgs .ERRO { color: var(--bad); } .msgs .AVISO { color: var(--warn); }
.checks label { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 4px; font-size: 14px; }
.decisao { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.decisao button { padding: 8px 14px; font-weight: 600; }
.decisao button.aprovado.on { background: var(--ok); color: #fff; border-color: var(--ok); }
.decisao button.ajustar.on { background: var(--warn); color: #fff; border-color: var(--warn); }
.decisao button.rejeitado.on { background: var(--bad); color: #fff; border-color: var(--bad); }
textarea { width: 100%; min-height: 70px; font: inherit; font-size: 14px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
kbd { font-size: 11px; border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; color: var(--muted); }
.banner { background: var(--del-bg); color: var(--del-fg); padding: 8px 16px; font-size: 14px; }
.hint { font-size: 12px; color: var(--muted); }
input[type=file] { display: none; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  aside { position: static; max-height: 260px; border-right: 0; border-bottom: 1px solid var(--border); }
  dl { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <h1>Revisão de adulterações · Exp. 1</h1>
  <div class="progress">
    <div class="bar" id="bar"></div>
    <div class="counts" id="counts"></div>
  </div>
  <div class="actions">
    <label class="filebtn" title="Carrega um CSV exportado antes (outro navegador, backup)">Importar CSV<input type="file" id="importar" accept=".csv"></label>
    <button id="exportar" title="Baixa revisao_adulteracoes.csv">Exportar revisão</button>
  </div>
</header>
<div id="banner"></div>
<div class="layout">
  <aside>
    <div class="filters">
      <select id="f-llm"><option value="">Todos os LLMs</option></select>
      <select id="f-tipo"><option value="">Todos os tipos</option></select>
      <select id="f-status">
        <option value="">Todas as situações</option>
        <option value="pendente">Pendentes</option>
        <option value="aprovado">Aprovados</option>
        <option value="ajustar">Ajustar</option>
        <option value="rejeitado">Rejeitados</option>
      </select>
      <label class="inline"><input type="checkbox" id="f-flag"> Só com avisos ou pré-triagem</label>
    </div>
    <ul class="list" id="lista"></ul>
  </aside>
  <main id="main"></main>
</div>
<script>
const DADOS = /*__DADOS__*/[];
const CHAVE = "vera-exp1-revisao-adulteracoes";
const DECISOES = ["aprovado", "ajustar", "rejeitado"];
const ROTULO = { aprovado: "Aprovar", ajustar: "Ajustar", rejeitado: "Rejeitar", pendente: "Pendente" };
const ATALHO = { a: "aprovado", j: "ajustar", r: "rejeitado" };

let estado = {};
try { estado = JSON.parse(localStorage.getItem(CHAVE) || "{}") || {}; } catch (e) { estado = {}; }

// Decisões gravadas para uma versão anterior do item (lote refeito) não valem mais.
const desatualizados = DADOS.filter(d => estado[d.id] && estado[d.id].impressao !== d.impressao).map(d => d.id);
desatualizados.forEach(id => delete estado[id]);

let filtrados = DADOS.slice();
let atual = 0;
let modo = "diff";

function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) { /* sem armazenamento: use Exportar */ }
}
function situacao(d) { return (estado[d.id] && estado[d.id].decisao) || "pendente"; }
function sinalizado(d) { return d.validador.length > 0 || (!!d.pretriagem && d.pretriagem.sinal !== "ok"); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function token(t) {
  if (/^\$[^$]+\$$/.test(t) && window.katex) {
    try { return katex.renderToString(t.slice(1, -1), { throwOnError: false }); } catch (e) { /* cai no texto */ }
  }
  return esc(t === "\\$" ? "$" : t);
}

// Renderiza tokens [[op, texto]]: parágrafos por quebra de linha e linhas "| a | b |" como tabela.
function renderTexto(tokens, modoAtual) {
  const visiveis = tokens.filter(([op]) => modoAtual === "diff" || op === "=" || (modoAtual === "original" ? op === "-" : op === "+"));
  const linhas = [[]];
  for (const tk of visiveis) {
    if (tk[1] === "\n") linhas.push([]); else linhas[linhas.length - 1].push(tk);
  }
  // Tokens vizinhos com a mesma operação viram um único <del>/<ins>.
  const html = (seq) => {
    const grupos = [];
    for (const [op, t] of seq) {
      const g = grupos[grupos.length - 1];
      if (g && g.op === op) g.partes.push(token(t)); else grupos.push({ op, partes: [token(t)] });
    }
    return grupos.map(({ op, partes }) => {
      const h = partes.join(" ");
      if (modoAtual !== "diff" || op === "=") return h;
      return op === "-" ? `<del>${h}</del>` : `<ins>${h}</ins>`;
    }).join(" ");
  };

  let out = "", tabela = [];
  const fecharTabela = () => {
    if (tabela.length) out += `<table>${tabela.join("")}</table>`;
    tabela = [];
  };
  for (const linha of linhas) {
    if (linha.length && linha[0][1] === "|") {
      const celulas = [[]];
      for (const tk of linha) { if (tk[1] === "|") celulas.push([]); else celulas[celulas.length - 1].push(tk); }
      const internas = celulas.slice(1, -1);
      if (internas.every(c => c.every(([, t]) => /^:?-+:?$/.test(t)))) continue;
      tabela.push("<tr>" + internas.map(c => `<td>${html(c)}</td>`).join("") + "</tr>");
    } else {
      fecharTabela();
      if (linha.length) out += `<p>${html(linha)}</p>`;
    }
  }
  fecharTabela();
  return out || '<p class="hint">(vazio)</p>';
}

function renderProgresso() {
  const n = { aprovado: 0, ajustar: 0, rejeitado: 0, pendente: 0 };
  DADOS.forEach(d => n[situacao(d)]++);
  const cor = { aprovado: "var(--ok)", ajustar: "var(--warn)", rejeitado: "var(--bad)" };
  document.getElementById("bar").innerHTML = DECISOES.map(k => `<span style="width:${100 * n[k] / DADOS.length}%;background:${cor[k]}"></span>`).join("");
  document.getElementById("counts").textContent =
    `${DADOS.length - n.pendente}/${DADOS.length} revisados · ${n.aprovado} aprovados · ${n.ajustar} ajustar · ${n.rejeitado} rejeitados`;
}

function aplicarFiltros() {
  const llm = document.getElementById("f-llm").value, tipo = document.getElementById("f-tipo").value;
  const st = document.getElementById("f-status").value, flag = document.getElementById("f-flag").checked;
  const idAtual = filtrados[atual] && filtrados[atual].id;
  filtrados = DADOS.filter(d => (!llm || d.llm === llm) && (!tipo || d.tipo === tipo) && (!st || situacao(d) === st) && (!flag || sinalizado(d)));
  const idx = filtrados.findIndex(d => d.id === idAtual);
  atual = idx >= 0 ? idx : 0;
  renderLista();
  renderItem();
}

function renderLista() {
  document.getElementById("lista").innerHTML = filtrados.map((d, i) =>
    `<li data-i="${i}" class="${i === atual ? "sel" : ""}"><span class="dot ${situacao(d)}"></span>` +
    `<span>${esc(d.id)} · ${esc(d.tipo)} · ${esc(d.llm)}</span>${sinalizado(d) ? '<span class="flag" title="avisos ou pré-triagem">⚑</span>' : ""}</li>`
  ).join("") || '<li class="hint">Nenhum item com esses filtros.</li>';
  const sel = document.querySelector(".list li.sel");
  if (sel) sel.scrollIntoView({ block: "nearest" });
}

function renderItem() {
  const main = document.getElementById("main");
  const d = filtrados[atual];
  if (!d) { main.innerHTML = '<div class="card">Nenhum item com esses filtros.</div>'; return; }
  const e = estado[d.id] || {};
  const gabMudou = d.gabarito_original !== d.gabarito_novo;

  const alternativas = d.alternativas.map(a => {
    const classes = ["alt"];
    if (a.letra === d.gabarito_novo) classes.push("gab");
    else if (gabMudou && a.letra === d.gabarito_original) classes.push("gab-orig");
    const tag = [a.letra === d.gabarito_novo ? "gabarito informado" : "", gabMudou && a.letra === d.gabarito_original ? "gabarito original" : "", a.mudou ? "alterada" : ""].filter(Boolean).join(" · ");
    return `<div class="${classes.join(" ")}"><span class="letra">${a.letra}</span><div class="texto">${renderTexto(a.diff, a.mudou ? modo : "diff")}</div><span class="tag">${tag}</span></div>`;
  }).join("");

  const corSinal = { ok: "var(--ok)", atencao: "var(--warn)", suspeito: "var(--bad)" };
  const pre = d.pretriagem
    ? `<div class="card"><h2>Pré-triagem (sugestão, não decisão)</h2><p style="margin:0"><b style="color:${corSinal[d.pretriagem.sinal] || "inherit"}">${esc(d.pretriagem.sinal)}</b> — ${esc(d.pretriagem.comentario)}</p></div>`
    : "";
  const validador = d.validador.length
    ? `<div class="card"><h2>Validador estrutural</h2><ul class="msgs">${d.validador.map(m => `<li class="${m.nivel}">[${m.nivel}] ${esc(m.mensagem)}</li>`).join("")}</ul></div>`
    : "";

  main.innerHTML = `
    <div class="card meta">
      <span class="chip tipo">${esc(d.tipo)}</span>
      <span class="chip">${esc(d.id)}</span><span class="chip">${esc(d.habilidade)}</span><span class="chip">${esc(d.ano)}</span>
      <span class="chip">${esc(d.llm)}</span><span class="chip">${esc(d.lote)}</span>
      <span class="nav"><button id="ant" title="Anterior (←)">←</button>${atual + 1}/${filtrados.length}<button id="prox" title="Próximo (→)">→</button></span>
    </div>
    <div class="card">
      <h2>Enunciado <span class="seg" id="modos">
        <button data-m="diff" class="${modo === "diff" ? "on" : ""}">Diferenças</button>
        <button data-m="original" class="${modo === "original" ? "on" : ""}">Original</button>
        <button data-m="adulterado" class="${modo === "adulterado" ? "on" : ""}">Adulterado</button>
      </span></h2>
      <div class="texto">${renderTexto(d.enunciado_diff, modo)}</div>
    </div>
    <div class="card">
      <h2>Alternativas</h2>
      <div class="alts">${alternativas}</div>
      <div class="gabline">Gabarito: ${gabMudou ? `<del>${esc(d.gabarito_original)}</del> → <ins>${esc(d.gabarito_novo)}</ins>` : `<b>${esc(d.gabarito_novo)}</b> (inalterado)`}</div>
    </div>
    <div class="card">
      <h2>O que o modelo declarou</h2>
      <dl>
        <dt>Descrição</dt><dd>${esc(d.descricao)}</dd>
        <dt>Trecho original</dt><dd>${esc(d.trecho_original)}</dd>
        <dt>Trecho adulterado</dt><dd>${d.trecho_adulterado ? esc(d.trecho_adulterado) : '<span class="hint">(remoção)</span>'}</dd>
        <dt>Resposta após adulteração</dt><dd>${esc(d.resposta_correta)}</dd>
      </dl>
    </div>
    ${validador}${pre}
    <div class="card">
      <h2>Sua revisão</h2>
      <div class="checks">${d.checklist.map((c, i) => `<label><input type="checkbox" data-c="${i}" ${(e.checks || []).includes(i) ? "checked" : ""}> ${esc(c)}</label>`).join("")}</div>
      <div class="decisao">${DECISOES.map(k => `<button class="${k} ${e.decisao === k ? "on" : ""}" data-d="${k}">${ROTULO[k]} <kbd>${Object.keys(ATALHO).find(a => ATALHO[a] === k).toUpperCase()}</kbd></button>`).join("")}</div>
      <textarea id="obs" placeholder="Observação (obrigatória para Ajustar/Rejeitar: o que está errado ou o que mudar)">${esc(e.obs || "")}</textarea>
      <p class="hint">Salvo automaticamente neste navegador. <kbd>←</kbd> <kbd>→</kbd> navegam; ao decidir, avança para o próximo.</p>
    </div>`;

  document.getElementById("ant").onclick = () => ir(atual - 1);
  document.getElementById("prox").onclick = () => ir(atual + 1);
  document.querySelectorAll("#modos button").forEach(b => b.onclick = () => { modo = b.dataset.m; renderItem(); });
  document.querySelectorAll(".decisao button").forEach(b => b.onclick = () => decidir(b.dataset.d));
  document.querySelectorAll(".checks input").forEach(cb => cb.onchange = () => {
    const checks = [...document.querySelectorAll(".checks input")].filter(x => x.checked).map(x => Number(x.dataset.c));
    atualizar(d, { checks });
  });
  document.getElementById("obs").oninput = (ev) => atualizar(d, { obs: ev.target.value });
}

function atualizar(d, campos) {
  estado[d.id] = { ...(estado[d.id] || {}), ...campos, impressao: d.impressao, data: new Date().toISOString() };
  salvar();
}

function decidir(decisao) {
  const d = filtrados[atual];
  const e = estado[d.id] || {};
  if (decisao !== "aprovado" && !(e.obs || "").trim()) {
    document.getElementById("obs").focus();
    document.getElementById("obs").placeholder = "Escreva o motivo antes de marcar " + ROTULO[decisao] + ".";
    return;
  }
  atualizar(d, { decisao: e.decisao === decisao ? undefined : decisao });
  renderProgresso();
  const st = document.getElementById("f-status").value;
  if (st) { aplicarFiltros(); return; }
  ir(e.decisao === decisao ? atual : atual + 1);
}

function ir(i) {
  if (i < 0 || i >= filtrados.length) return;
  atual = i;
  renderLista();
  renderItem();
  window.scrollTo({ top: 0 });
}

// CSV ------------------------------------------------------------------------
const COLUNAS = ["id", "llm", "lote", "tipo_erro", "impressao", "decisao", "checklist_marcados", "observacao", "data_revisao"];
function csvCampo(v) { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
function exportar() {
  const linhas = [COLUNAS.join(",")].concat(DADOS.map(d => {
    const e = estado[d.id] || {};
    const marcados = (e.checks || []).map(i => d.checklist[i]).join(" | ");
    return [d.id, d.llm, d.lote, d.tipo, d.impressao, e.decisao || "pendente", marcados, e.obs || "", e.data || ""].map(csvCampo).join(",");
  }));
  const blob = new Blob(["﻿" + linhas.join("\n") + "\n"], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "revisao_adulteracoes.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}
function parseCsv(texto) {
  const linhas = []; let campo = "", linha = [], aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (aspas) {
      if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') aspas = false; else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === ",") { linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && texto[i + 1] === "\n") i++;
      linha.push(campo); linhas.push(linha); linha = []; campo = "";
    } else campo += c;
  }
  if (campo || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas.filter(l => l.some(x => x !== ""));
}
function importar(texto) {
  const [cab, ...linhas] = parseCsv(texto.replace(/^﻿/, ""));
  const idx = Object.fromEntries(cab.map((c, i) => [c, i]));
  const porId = Object.fromEntries(DADOS.map(d => [d.id, d]));
  let ok = 0, velhos = 0;
  for (const l of linhas) {
    const d = porId[l[idx.id]];
    if (!d) continue;
    if (l[idx.impressao] !== d.impressao) { velhos++; continue; }
    const marcados = (l[idx.checklist_marcados] || "").split(" | ").filter(Boolean);
    const decisao = l[idx.decisao];
    estado[d.id] = {
      decisao: DECISOES.includes(decisao) ? decisao : undefined,
      checks: marcados.map(m => d.checklist.indexOf(m)).filter(i => i >= 0),
      obs: l[idx.observacao] || "", impressao: d.impressao, data: l[idx.data_revisao] || "",
    };
    ok++;
  }
  salvar();
  alert(`${ok} itens importados.` + (velhos ? ` ${velhos} ignorados porque o item foi refeito depois da revisão.` : ""));
  renderProgresso(); aplicarFiltros();
}

// Inicialização ---------------------------------------------------------------
function preencherSelect(id, valores) {
  document.getElementById(id).innerHTML += [...new Set(valores)].sort().map(v => `<option>${esc(v)}</option>`).join("");
}
preencherSelect("f-llm", DADOS.map(d => d.llm));
preencherSelect("f-tipo", DADOS.map(d => d.tipo));
["f-llm", "f-tipo", "f-status", "f-flag"].forEach(id => document.getElementById(id).onchange = aplicarFiltros);
document.getElementById("lista").onclick = (ev) => { const li = ev.target.closest("li[data-i]"); if (li) ir(Number(li.dataset.i)); };
document.getElementById("exportar").onclick = exportar;
document.getElementById("importar").onchange = (ev) => { const f = ev.target.files[0]; if (f) f.text().then(importar); ev.target.value = ""; };
document.addEventListener("keydown", (ev) => {
  if (["TEXTAREA", "INPUT", "SELECT"].includes(document.activeElement.tagName) || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === "ArrowLeft") ir(atual - 1);
  else if (ev.key === "ArrowRight") ir(atual + 1);
  else if (ATALHO[ev.key.toLowerCase()]) decidir(ATALHO[ev.key.toLowerCase()]);
});
if (desatualizados.length) {
  salvar();
  document.getElementById("banner").innerHTML = `<div class="banner">${desatualizados.length} decisão(ões) descartada(s) porque o item foi refeito depois da revisão: ${desatualizados.map(esc).join(", ")}.</div>`;
}
if (!window.katex) {
  document.getElementById("banner").innerHTML += '<div class="banner">KaTeX não carregou (sem internet?): as fórmulas aparecem como LaTeX bruto.</div>';
}
renderProgresso();
aplicarFiltros();
</script>
